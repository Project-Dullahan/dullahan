[package]
name = "dullahan"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
ratatui = "0.26"
crossterm = "0.27"
chrono = "0.4"
maxminddb = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
trust-dns-resolver = "0.23"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
scraper = "0.18"
url = "2.5"
kamadak-exif = "0.5"
# NEW: Pure-Rust TLS and X.509 parsing (No system OpenSSL required)
rustls = "0.21"
webpki-roots = "0.25"
x509-parser = "0.15"
