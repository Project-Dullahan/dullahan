<!DOCTYPE html>
<html>
<head>
    <title>Dullahan Tactical Dashboard</title>
    <link rel="stylesheet" href="leaflet.css" />
    <script src="leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex; height: 100vh; overflow: hidden;
            background: #0a0a0a; color: #c0c0c0;
            font-family: "Courier New", Courier, monospace;
        }
        #sidebar {
            width: 400px; min-width: 400px; max-width: 400px;
            background: #111111; border-right: 2px solid #333;
            display: flex; flex-direction: column;
        }
        #sidebar-header {
            padding: 15px; background: #1a1a1a; border-bottom: 1px solid #333;
            font-size: 16px; font-weight: bold; color: #00ff41; text-transform: uppercase; letter-spacing: 1px;
        }
        #dossier-list {
            flex: 1; overflow-y: auto; padding: 10px;
        }
        .dossier-card {
            background: #161616; border: 1px solid #333; border-left-width: 4px;
            margin-bottom: 10px; padding: 12px; cursor: pointer;
        }
        .dossier-card:hover { background: #222; }
        .dossier-card.active { background: #2a2a2a; border-color: #fff; }
        .dossier-header { font-size: 14px; font-weight: bold; margin-bottom: 6px; }
        .dossier-row { font-size: 12px; margin: 3px 0; display: flex; }
        .dossier-row .label { color: #666; width: 50px; flex-shrink: 0; }
        #map-container { flex: 1; height: 100%; position: relative; }
        #map { height: 100%; width: 100%; }
        .leaflet-tile-pane { filter: grayscale(100%) invert(100%) contrast(120%); }
        .legend {
            position: absolute; bottom: 20px; right: 20px; z-index: 1000;
            background: rgba(17, 17, 17, 0.95); padding: 12px; border: 1px solid #444;
        }
        .legend-item {
            display: block; margin: 6px 0; font-size: 12px;
            cursor: pointer; padding: 4px 8px;
        }
        .legend-item:hover { background: rgba(255,255,255,0.1); }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div id="sidebar-header">> DULLAHAN RECON LOG</div>
        <div id="dossier-list">
            SIDEBAR_PLACEHOLDER
        </div>
    </div>
    <div id="map-container">
        <div id="map"></div>
        <div class="legend">
            <div class="legend-item" onclick="filterMarkers('all')">
                <span class="dot" style="background: #fff;"></span> ALL
            </div>
            <div class="legend-item" onclick="filterMarkers('high')">
                <span class="dot" style="background: #ff0033;"></span> HIGH RISK
            </div>
            <div class="legend-item" onclick="filterMarkers('obfuscated')">
                <span class="dot" style="background: #ffaa00;"></span> OBFUSCATED
            </div>
            <div class="legend-item" onclick="filterMarkers('neutral')">
                <span class="dot" style="background: #00ff41;"></span> NEUTRAL
            </div>
        </div>
    </div>
    <script>
        var map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var markersData = MARKERS_PLACEHOLDER;
        var markers = [];

        markersData.forEach(function(m, idx) {
            var icon = L.divIcon({
                className: 'custom-div-icon',
                html: '<div style="background-color:' + m.color + '; width:14px; height:14px; border-radius:50%; box-shadow: 0 0 10px ' + m.color + ';"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });
            
            var marker = L.marker([m.lat, m.lon], {icon: icon}).addTo(map);
            marker.bindPopup('<b style="color:' + m.color + '">' + m.domain + '</b><br>IP: ' + m.ip + '<br>LOC: ' + m.city + ', ' + m.country);
            markers.push(marker);
            
            marker.on('click', function() {
                document.querySelectorAll('.dossier-card').forEach(function(el) { el.classList.remove('active'); });
                var card = document.getElementById('dossier-' + idx);
                if (card) {
                    card.classList.add('active');
                    card.scrollIntoView({behavior: 'smooth', block: 'center'});
                }
            });
        });

        function filterMarkers(category) {
            markers.forEach(function(marker, idx) {
                var m = markersData[idx];
                if (category === 'all') {
                    marker.addTo(map);
                } else if (category === 'high' && m.color === '#ff0033') {
                    marker.addTo(map);
                } else if (category === 'obfuscated' && m.color === '#ffaa00') {
                    marker.addTo(map);
                } else if (category === 'neutral' && m.color === '#00ff41') {
                    marker.addTo(map);
                } else {
                    map.removeLayer(marker);
                }
            });
        }

        function focusMap(lat, lon) {
            map.flyTo([lat, lon], 10, {duration: 1.5});
        }
    </script>
</body>
</html>
